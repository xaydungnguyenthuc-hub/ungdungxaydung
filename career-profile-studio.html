<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Career Profile Studio – Quản lý hồ sơ nghề nghiệp</title>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>

<style>
:root{--bg:#f5f7fa;--card:#fff;--tx:#1b2433;--mu:#66738a;--bd:#dde3ec;--pr:#14407a;--pr2:#e7eef8;--ok:#1b7a4b;--wa:#b26a00;--er:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0f1521;--card:#171f2e;--tx:#e6ebf3;--mu:#97a3b8;--bd:#2a3549;--pr:#7fb0ff;--pr2:#1d2a42;--ok:#5cc58f;--wa:#e6a23c;--er:#ff8a80}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
#app{display:flex;min-height:100vh}
nav{width:232px;background:var(--card);border-right:1px solid var(--bd);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
nav h1{font-size:16px;margin:4px 8px 14px;color:var(--pr)}nav h1 small{display:block;font-weight:400;color:var(--mu);font-size:12px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:8px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button:hover{background:var(--pr2)}nav button.on{background:var(--pr);color:#fff}
@media(prefers-color-scheme:dark){nav button.on{color:#0f1521}}
.sep{height:1px;background:var(--bd);margin:8px 4px}
#right{flex:1;min-width:0}
header{display:flex;gap:12px;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
header input{flex:1;max-width:420px}#st{color:var(--mu);font-size:13px;white-space:nowrap}
main{padding:20px;max-width:1150px}
h2{margin:0 0 4px;font-size:22px}.sub{color:var(--mu);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}.stat b{font-size:24px;display:block;color:var(--pr)}.stat span{color:var(--mu);font-size:13px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:76px;resize:vertical}input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}label.ck{display:flex;gap:8px;align-items:center;color:var(--tx)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 13px;border-radius:6px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--pr)}.btn.p{background:var(--pr);border-color:var(--pr);color:#fff}.btn.d{color:var(--er)}.btn.s{padding:3px 8px;font-size:13px}
@media(prefers-color-scheme:dark){.btn.p{color:#0f1521}}
:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.bar input,.bar select{width:auto;flex:1;min-width:140px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-weight:600;font-size:13px}
.tw{overflow-x:auto}.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--pr2);color:var(--pr)}
.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}.empty{padding:28px;text-align:center;color:var(--mu)}
dialog{border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);width:min(680px,94vw);max-height:90vh;padding:20px}
dialog::backdrop{background:rgba(10,20,40,.5)}.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.fg .w{grid-column:1/-1}
@media(max-width:700px){.fg{grid-template-columns:1fr}}
#toast{position:fixed;bottom:18px;right:18px;background:var(--pr);color:#fff;padding:10px 16px;border-radius:8px;display:none;z-index:99;max-width:80vw}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px}@media(max-width:900px){.two{grid-template-columns:1fr}}
.pv{background:#fff;color:#222;border:1px solid var(--bd);padding:26px;font-family:Calibri,Arial,sans-serif;font-size:13px;max-height:75vh;overflow:auto}
.pv h3{font-size:15px;margin:16px 0 6px;border-bottom:2px solid;padding-bottom:2px}.pv h4{margin:8px 0 0;font-size:13.5px}.pv .m{color:#666;font-size:12px}.pv ul{margin:3px 0 6px;padding-left:18px}
.sel{max-height:200px;overflow:auto;border:1px solid var(--bd);border-radius:6px;padding:6px 10px;margin-bottom:12px}
@media(max-width:800px){#app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:2px}nav h1{width:100%}nav button{width:auto}.sep{display:none}}
</style></head><body>
<div id="app"><nav id="nav"></nav><div id="right"><header><input id="gs" type="search" placeholder="Tìm kiếm toàn cục…" aria-label="Tìm kiếm"><span id="st">Chưa có thay đổi</span></header><main id="main"></main></div></div>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),today=()=>new Date().toISOString().slice(0,10);
const lines=s=>(s||'').split('\n').map(x=>x.trim()).filter(Boolean),fm=m=>m?m.slice(5)+'/'+m.slice(0,4):'',fd=d=>d?d.split('-').reverse().join('/'):'';
const mi=m=>+m.slice(0,4)*12+ +m.slice(5,7),nowM=()=>mi(today().slice(0,7));
const rng=e=>fm(e.start)+' – '+(e.end?fm(e.end):'Hiện tại');
const VIS=['Cá nhân','Nội bộ','CV','Công khai'],GRP=['Chuyên môn','Quản lý','Giao tiếp','Phân tích','Công nghệ','Ngoại ngữ','Khác'];
const S={
employment:{t:'Quá trình công tác',add:'Thêm công việc',cols:['company','title','start','end'],f:[['company','Công ty / tổ chức','text',1],['title','Chức danh','text',1],['dept','Phòng ban','text'],['location','Địa điểm','text'],['start','Bắt đầu','month',1],['end','Kết thúc (bỏ trống nếu đang làm)','month'],['desc','Trách nhiệm chính (mỗi dòng một ý)','area'],['ach','Thành tích nổi bật (mỗi dòng một ý)','area'],['tools','Công cụ, phần mềm','text']]},
projects:{t:'Dự án / Công trình',add:'Thêm dự án',cols:['code','name','role','start','vis'],f:[['code','Mã dự án','text'],['name','Tên dự án / công trình','text',1],['investor','Chủ đầu tư','text'],['location','Địa điểm','text'],['type','Loại công trình','text'],['scale','Quy mô','text'],['value','Giá trị (chỉ hiện trong hồ sơ công khai)','text'],['company','Công ty tại thời điểm tham gia','text'],['role','Vai trò / chức danh trong dự án','text',1],['start','Bắt đầu','month',1],['end','Kết thúc','month'],['duties','Công việc đảm nhận (mỗi dòng một ý)','area'],['results','Kết quả, thành tích (chỉ số liệu có thật)','area'],['tools','Công cụ, phần mềm','text'],['vis','Chế độ bảo mật','vis']]},
skills:{t:'Kỹ năng chuyên môn',add:'Thêm kỹ năng',cols:['name','group','level','years'],f:[['name','Tên kỹ năng','text',1],['group','Nhóm','sel',0,GRP],['level','Tự đánh giá (1–5)','sel',0,['1','2','3','4','5']],['years','Số năm sử dụng','number'],['note','Ghi chú / minh chứng','area']]},
certs:{t:'Bằng cấp & chứng chỉ',add:'Thêm chứng chỉ',cols:['name','issuer','issued','expires','verified'],f:[['name','Tên bằng cấp / chứng chỉ','text',1],['issuer','Đơn vị cấp','text'],['no','Mã số','text'],['issued','Ngày cấp','date'],['expires','Ngày hết hạn','date'],['verified','Đã xác minh','check'],['note','Ghi chú','area']]},
achievements:{t:'Thành tích & sản phẩm',add:'Thêm thành tích',cols:['name','date','vis'],f:[['name','Tên thành tích / sản phẩm','text',1],['date','Ngày thực hiện','date'],['context','Bối cảnh & vấn đề','area'],['action','Vai trò & phương pháp','area'],['result','Kết quả (số liệu có thật)','area'],['link','Đường dẫn tài liệu','text'],['vis','Chế độ bảo mật','vis']]},
goals:{t:'Mục tiêu nghề nghiệp',add:'Thêm mục tiêu',cols:['name','deadline','priority','status','progress'],f:[['name','Tên mục tiêu','text',1],['deadline','Thời hạn','date'],['priority','Ưu tiên','sel',0,['Cao','Trung bình','Thấp']],['status','Trạng thái','sel',0,['Chưa bắt đầu','Đang thực hiện','Hoàn thành']],['progress','Tiến độ (%)','number'],['desc','Mô tả, các bước thực hiện','area']]}};
const PF=[['name','Họ và tên','text'],['nameEn','Tên tiếng Anh','text'],['title','Chức danh hiện tại','text'],['field','Ngành nghề / chuyên môn','text'],['phone','Điện thoại','text'],['email','Email','text'],['addr','Khu vực làm việc','text'],['web','Website / LinkedIn / Portfolio','text'],['goal','Mục tiêu nghề nghiệp','area'],['intro','Giới thiệu bản thân','area'],['strengths','Điểm mạnh chuyên môn (mỗi dòng một ý)','area']];
const TPL={'Modern Professional':{color:'14407A',font:'Calibri'},'Technical Engineer':{color:'0E6B6B',font:'Arial'},'Executive':{color:'2B2B2B',font:'Times New Roman'},'Minimalist':{color:'000000',font:'Calibri'},'Construction Portfolio':{color:'B45309',font:'Arial'},'Project Manager':{color:'1D4ED8',font:'Calibri'},'Corporate':{color:'0F3D2E',font:'Times New Roman'},'International CV':{color:'333333',font:'Arial'}};
const NAV=[['dash','Tổng quan'],['profile','Hồ sơ cá nhân'],['employment','Quá trình công tác'],['projects','Dự án / Công trình'],['skills','Kỹ năng'],['certs','Bằng cấp & chứng chỉ'],['achievements','Thành tích & sản phẩm'],['goals','Mục tiêu nghề nghiệp'],0,['cv','Trình tạo CV'],['portfolio','Hồ sơ năng lực'],['check','Kiểm tra hồ sơ'],['assist','Trợ lý cục bộ'],['import','Nhập dữ liệu'],['files','Tệp đính kèm'],['history','Lịch sử xuất file'],0,['trash','Thùng rác'],['log','Nhật ký thao tác'],['backup','Sao lưu / Phục hồi'],['settings','Cài đặt'],['help','Hướng dẫn']];
const K='cps_v1';let cur='dash',D=load(),Q='';
function init(){return{profile:{},employment:[],projects:[],skills:[],certs:[],achievements:[],goals:[],exports:[],cvsel:{},cfg:{tpl:'Modern Professional',purpose:''}}}
function load(){try{const d=JSON.parse(localStorage.getItem(K));return d?Object.assign(init(),d):init()}catch(e){return init()}}
function save(){try{localStorage.setItem(K,JSON.stringify(D));$('#st').textContent='Đã lưu lúc '+new Date().toLocaleTimeString('vi')}catch(e){toast('Không lưu được: '+e.message)}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3800)}
const live=c=>D[c].filter(x=>!x.del);
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function months(){const iv=live('employment').filter(e=>e.start).map(e=>[mi(e.start),e.end?mi(e.end):nowM()]).sort((a,b)=>a[0]-b[0]);let t=0,c=null;for(const i of iv){if(!c)c=[...i];else if(i[0]<=c[1]+0)c[1]=Math.max(c[1],i[1]);else{t+=c[1]-c[0];c=[...i]}}if(c)t+=c[1]-c[0];return t}
function overlaps(){const a=live('employment').filter(e=>e.start).sort((x,y)=>x.start.localeCompare(y.start)),r=[];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const e1=a[i].end?mi(a[i].end):nowM();if(mi(a[j].start)<e1)r.push([a[i],a[j]])}return r}
function certState(c){if(!c.expires)return'';const d=(new Date(c.expires)-new Date(today()))/864e5;return d<0?'Đã hết hạn':d<=90?'Sắp hết hạn':'Còn hiệu lực'}
function cell(c,k,v){if(k==='vis')return`<span class="tag">${esc(v||'Cá nhân')}</span>`;if(k==='start'||k==='end')return v?fm(v):(k==='end'?'Hiện tại':'');if(k==='issued'||k==='deadline'||k==='date')return fd(v);
 if(k==='expires'){const s=certState({expires:v});return v?fd(v)+` <span class="${s==='Đã hết hạn'?'er':s==='Sắp hết hạn'?'wa':'ok'}">${s}</span>`:''}
 if(k==='verified')return v?'<span class="ok">Đã xác minh</span>':'<span class="wa">Chưa xác minh</span>';if(k==='progress')return(v||0)+'%';return esc(v)}
const V={};
V.dash=()=>{const m=months(),P=D.profile,ex=live('certs').filter(c=>['Sắp hết hạn','Đã hết hạn'].includes(certState(c))),inc=live('projects').filter(p=>!p.role||!p.duties);
 const fields=[P.name,P.title,P.phone||P.email,P.intro,P.goal],pc=Math.round(fields.filter(Boolean).length/fields.length*100);
 const st=[[(m/12).toFixed(1),'Năm kinh nghiệm (không tính trùng)'],[new Set(live('employment').map(e=>e.company)).size,'Công ty'],[live('projects').length,'Dự án'],[live('skills').length,'Kỹ năng'],[live('certs').length,'Chứng chỉ'],[live('achievements').length,'Thành tích / sản phẩm'],[D.exports.length,'Lần xuất file'],[pc+'%','Hoàn thiện hồ sơ (tham khảo)']];
 const rec=['employment','projects','skills','certs','achievements','goals'].flatMap(c=>live(c).map(x=>({c,x}))).sort((a,b)=>(b.x.updated||'').localeCompare(a.x.updated||'')).slice(0,6);
 return`<h2>${esc(P.name||'Chào mừng bạn')}</h2><p class="sub">${esc(P.title||'Hãy bắt đầu bằng việc nhập hồ sơ cá nhân.')}</p>
 <div class="bar"><button class="btn p" data-go="cv">Tạo CV mới</button><button class="btn" data-add="employment">Thêm kinh nghiệm</button><button class="btn" data-add="projects">Thêm dự án</button><button class="btn" data-go="portfolio">Xuất hồ sơ năng lực</button></div>
 <div class="grid">${st.map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div>
 <div class="two"><div class="card"><b>Cần chú ý</b>${ex.length||inc.length?'<ul>'+ex.map(c=>`<li>${esc(c.name)}: <span class="wa">${certState(c)}</span></li>`).join('')+inc.map(p=>`<li>Dự án “${esc(p.name)}” chưa đủ vai trò hoặc mô tả</li>`).join('')+'</ul>':'<p class="sub">Không có mục nào cần xử lý.</p>'}</div>
 <div class="card"><b>Cập nhật gần đây</b>${rec.length?'<ul>'+rec.map(r=>`<li>${esc(S[r.c].t)}: ${esc(r.x.name||r.x.title||r.x.company)}</li>`).join('')+'</ul>':'<p class="sub">Chưa có dữ liệu.</p>'}</div></div>`};
V.profile=()=>{const P=D.profile;return`<h2>Hồ sơ cá nhân</h2><p class="sub">Dữ liệu nhập một lần, dùng lại cho mọi CV.</p><form id="pf" class="card"><div class="fg">${PF.map(f=>`<label class="${f[2]==='area'?'w':''}">${f[1]}${f[2]==='area'?`<textarea name="${f[0]}">${esc(P[f[0]])}</textarea>`:`<input name="${f[0]}" value="${esc(P[f[0]])}">`}</label>`).join('')}</div>
 <p class="sub">Ẩn khỏi tài liệu xuất:</p><div class="bar"><label class="ck"><input type="checkbox" name="hidePhone" ${P.hidePhone?'checked':''}>Số điện thoại</label><label class="ck"><input type="checkbox" name="hideEmail" ${P.hideEmail?'checked':''}>Email</label><label class="ck"><input type="checkbox" name="hideAddr" ${P.hideAddr?'checked':''}>Địa chỉ</label></div>
 <label>Ảnh đại diện<input type="file" id="ph" accept="image/*"></label>${P.photo?'<img src="'+P.photo+'" width="64" style="border-radius:6px"> <button type="button" class="btn s" id="phx">Xóa ảnh</button><label class="ck"><input type="checkbox" name="hidePhoto" '+(P.hidePhoto?'checked':'')+'>Ẩn ảnh khỏi tài liệu xuất</label>':''}<label>Số năm kinh nghiệm hiển thị (để trống = tự tính ${(months()/12).toFixed(1)} năm, không tính trùng)<input name="yearsOv" value="${esc(P.yearsOv)}"></label><button class="btn p">Lưu hồ sơ</button></form>`};
V.list=c=>{const s=S[c];return`<h2>${s.t}</h2><p class="sub">${live(c).length} bản ghi</p><div class="bar"><input id="q" type="search" placeholder="Lọc theo từ khóa…" value="${esc(Q)}"><button class="btn p" data-add="${c}">${s.add}</button>${c==='skills'?'<button class="btn" id="lib">Thêm từ thư viện xây dựng</button>':''}</div>
 ${c==='employment'&&overlaps().length?`<div class="card wa">Có ${overlaps().length} cặp công việc chồng lấn thời gian: ${overlaps().map(o=>esc(o[0].company)+' / '+esc(o[1].company)).join('; ')}. Vui lòng kiểm tra lại.</div>`:''}
 <div class="card tw"><table><thead><tr>${s.cols.map(k=>`<th>${esc(s.f.find(f=>f[0]===k)?.[1].replace(/ \(.*/,'')||k)}</th>`).join('')}<th></th></tr></thead><tbody id="tb"></tbody></table></div>`};
function rows(){const c=cur,s=S[c];let a=live(c);const q=Q.toLowerCase();if(q)a=a.filter(x=>JSON.stringify(x).toLowerCase().includes(q));
 a.sort((x,y)=>((y.start||y.date||y.issued||y.updated)||'').localeCompare((x.start||x.date||x.issued||x.updated)||''));
 $('#tb').innerHTML=a.length?a.map(x=>`<tr>${s.cols.map(k=>`<td>${cell(c,k,x[k])}</td>`).join('')}<td style="white-space:nowrap"><button class="btn s" data-edit="${x.id}">Sửa</button> <button class="btn s" data-dup="${x.id}">Sao chép</button> <button class="btn s d" data-del="${x.id}">Xóa</button></td></tr>`).join(''):`<tr><td colspan="9" class="empty">Chưa có dữ liệu. Nhấn “${s.add}” để bắt đầu.</td></tr>`}
function form(c,id){const s=S[c],x=id?D[c].find(i=>i.id===id):{};const d=$('#dlg');
 d.innerHTML=`<form method="dialog" id="ef"><h3>${id?'Sửa':'Thêm'}: ${s.t}</h3><div class="fg">${s.f.map(f=>{const[k,l,t,r,o]=f,v=x[k]??(k==='vis'?'Cá nhân':'');const L=l+(r?' *':'');
 if(t==='ref'||t==='refs')return refField(f,x[k]);if(t==='area')return`<label class="w">${L}<textarea name="${k}">${esc(v)}</textarea></label>`;if(t==='check')return`<label class="ck w"><input type="checkbox" name="${k}" ${v?'checked':''}>${l}</label>`;
 if(t==='sel'||t==='vis')return`<label>${L}<select name="${k}">${(o||VIS).map(i=>`<option ${i==v?'selected':''}>${i}</option>`).join('')}</select></label>`;
 return`<label>${L}<input name="${k}" type="${t==='number'?'number':t}" value="${esc(v)}" ${r?'required':''}></label>`}).join('')}</div>
 <div class="bar"><button class="btn p" value="ok">Lưu</button><button class="btn" type="button" id="cx">Hủy</button></div></form>`;d.showModal();
 $('#cx').onclick=()=>d.close();
 $('#ef').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),o=id?x:{id:uid(),created:new Date().toISOString()};
  for(const f of s.f)o[f[0]]=f[2]==='check'?fd.has(f[0]):f[2]==='refs'?fd.getAll(f[0]):(fd.get(f[0])||'').trim();

function csvParse(s){const r=[];let row=[],c='',q=0;s=s.replace(/^\ufeff/,'');for(let i=0;i<s.length;i++){const ch=s[i];if(q){if(ch=='"'){if(s[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}else if(ch=='"')q=1;else if(ch==','||ch==';'){row.push(c);c='';}else if(ch=='\n'){row.push(c);r.push(row);row=[];c=''}else if(ch!='\r')c+=ch}if(c||row.length){row.push(c);r.push(row)}return r.filter(x=>x.some(v=>v.trim()))}

 else if(id==='jdgo'){const stop=new Set('và,các,của,cho,với,có,là,trong,được,một,những,khi,tại,the,and,for,with,from,that,this,you,are,will,have,năm,kinh,nghiệm,yêu,cầu'.split(','));
  const tk=[...new Set(($('#jd').value.toLowerCase().match(/[\p{L}\p{N}+#.]{3,}/gu)||[]).filter(w=>!stop.has(w)))],corpus=JSON.stringify([live('skills'),live('employment'),live('projects'),live('certs')]).toLowerCase(),hit=tk.filter(w=>corpus.includes(w)),miss=tk.filter(w=>!corpus.includes(w));

 a.sort((x,y)=>SORT?SORT.d*String(x[SORT.k]??'').localeCompare(String(y[SORT.k]??''),'vi',{numeric:true}):((y.start||y.date||y.issued||y.updated)||'').localeCompare((x.start||x.date||x.issued||x.updated)||''));
 const n=Math.ceil(a.length/PS)||1;PG=Math.min(PG,n-1);const pa=a.slice(PG*PS,PG*PS+PS);
 $('#tb').innerHTML=pa.length?pa.map(x=>`<tr><td><input type="checkbox" data-chk="${x.id}" ${CHK.has(x.id)?'checked':''}></td>${s.cols.map(k=>`<td>${cell(c,k,x[k])}</td>`).join('')}<td style="white-space:nowrap">${x.tags?x.tags.split(',').map(t=>`<span class="tag">${esc(t.trim())}</span>`).join(' ')+' ':''}${c==='projects'?`<button class="btn s" data-gen="${x.id}">Mô tả</button> `:''}<button class="btn s" data-edit="${x.id}">Sửa</button> <button class="btn s" data-dup="${x.id}">Sao chép</button> <button class="btn s d" data-del="${x.id}">Xóa</button></td></tr>`).join(''):`<tr><td colspan="9" class="empty">Chưa có dữ liệu. Nhấn “${s.add}” để bắt đầu.</td></tr>`;
 $('#pg').innerHTML=n>1?`<button class="btn s" data-pg="-1">‹ Trước</button> Trang ${PG+1}/${n} <button class="btn s" data-pg="1">Sau ›</button>`:'';
 $('#bulk').innerHTML=CHK.size?`${CHK.size} bản ghi đã chọn <button class="btn s d" id="bdel">Xóa</button> <button class="btn s" id="btag">Gắn nhãn</button>`:''}
/* Mô tả dự án theo quy tắc */
function genProj(p){const e=D.employment.find(x=>x.id===p.empId),org=p.company||(e&&e.company),du=lines(p.duties),re=lines(p.results);
 const sh=`${p.role}${org?' tại '+org:''}, dự án ${p.name}${p.location?' ('+p.location+')':''}${p.investor?', chủ đầu tư '+p.investor:''}${p.scale?', quy mô '+p.scale:''}${p.start?', thời gian '+rng(p):''}.`;
 return{sh,det:[sh,du.length&&'Phạm vi công việc: '+du.join('; ')+'.',re.length&&'Kết quả: '+re.join('; ')+'.',p.tools&&'Công cụ: '+p.tools+'.'].filter(Boolean).join(' '),du,re}}
/* Bản giới thiệu */
function introForm(id){const it=(D.intros||[]).find(i=>i.id===id)||{},d=$('#dlg');d.innerHTML=`<form id="inf"><h3>${id?'Sửa':'Thêm'} bản giới thiệu</h3><label>Tên (VD: Ngắn, QS, Quản lý dự án)<input name="n" required value="${esc(it.name)}"></label><label>Nội dung<textarea name="t" required>${esc(it.text)}</textarea></label><div class="bar"><button class="btn p">Lưu</button><button class="btn" type="button" id="libx">Hủy</button></div></form>`;d.showModal();
 $('#inf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);D.intros=D.intros||[];if(id){it.name=f.get('n');it.text=f.get('t')}else D.intros.push({id:uid(),name:f.get('n'),text:f.get('t')});save();d.close();render()}}
function introsCard(){const a=D.intros||[];return`<div class="card"><b>Các bản giới thiệu</b><p class="sub">Chọn bản dùng cho từng CV ở màn hình tạo CV. Các nút “Tạo bản” chỉ cắt theo số câu từ phần giới thiệu ở trên, không viết thêm nội dung.</p><div class="bar"><button class="btn p" id="iadd">Thêm bản mới</button><button class="btn" data-igen="1">Tạo bản ngắn</button><button class="btn" data-igen="3">Tạo bản vừa</button><button class="btn" data-igen="99">Tạo bản dài</button></div>${a.length?`<table>${a.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.text.slice(0,90))}…</td><td><button class="btn s" data-iedit="${i.id}">Sửa</button> <button class="btn s d" data-idel="${i.id}">Xóa</button></td></tr>`).join('')}</table>`:''}</div>`}
const _p=V.profile;V.profile=()=>_p()+introsCard();
/* Phiên bản CV */
function vers(type){const a=(D.versions||[]).filter(v=>v.type===type);return`<div class="card"><b>Phiên bản đã lưu</b><div class="bar"><input id="vname" placeholder="Tên phiên bản, VD: QS – Công ty ABC"><button class="btn p" id="vsave">Lưu phiên bản hiện tại</button><button class="btn" id="bexp">Xuất cả CV và Hồ sơ năng lực</button></div>${a.length?`<table>${a.map(v=>`<tr><td><input type="checkbox" data-vcmp="${v.id}"></td><td>${esc(v.name)}<div class="sub">${esc(v.tpl)} · ${Object.keys(v.sel).length} mục · ${new Date(v.date).toLocaleDateString('vi')}</div></td><td><button class="btn s" data-vopen="${v.id}">Mở</button> <button class="btn s" data-vdup="${v.id}">Nhân bản</button> <button class="btn s d" data-vdel="${v.id}">Xóa</button></td></tr>`).join('')}</table><div class="bar"><button class="btn" id="vcmp">So sánh 2 phiên bản đã tích</button></div><div id="vres"></div>`:'<p class="sub">Chưa có phiên bản nào.</p>'}</div>`}
const _b=builder;builder=function(t){return _b(t)+vers(t)};
/* Dashboard: hướng dẫn làm quen */
const _d=V.dash;V.dash=()=>{const P=D.profile,L=[[P.name&&P.title,'Nhập họ tên và chức danh','profile'],[live('employment').length,'Thêm công việc đầu tiên','employment'],[live('projects').length,'Thêm một dự án','projects'],[live('skills').length,'Thêm kỹ năng','skills'],[live('certs').length,'Thêm chứng chỉ','certs'],[Object.keys(D.cvsel).length,'Chọn dữ liệu cho CV','cv'],[D.exports.length,'Xuất file đầu tiên','cv']],todo=L.filter(x=>!x[0]);
 return _d()+(todo.length?`<div class="card"><b>Bắt đầu nhanh (${L.length-todo.length}/${L.length})</b><div class="bar">${todo.map(x=>`<button class="btn s" data-go="${x[2]}">${x[1]}</button>`).join('')}</div></div>`:'')};
/* Sao lưu ZIP, Excel */
async function zipBackup(){if(!window.JSZip){toast('Không tải được thư viện ZIP. Hãy kiểm tra kết nối mạng.');return}try{const z=new JSZip(),fl=await fx('readonly',s=>s.getAll()),ix=[];z.file('data.json',JSON.stringify({app:'CPS',version:2,date:new Date().toISOString(),data:D}));fl.forEach(f=>{z.file('files/'+f.id,f.blob);ix.push({id:f.id,name:f.name,note:f.note,ref:f.ref,date:f.date})});z.file('files.json',JSON.stringify(ix));dl(await z.generateAsync({type:'blob'}),'Sao_luu_day_du_'+today()+'.zip');toast('Đã sao lưu ZIP gồm '+fl.length+' tệp đính kèm.')}catch(e){toast('Sao lưu thất bại: '+e.message)}}
async function zipRestore(file){try{const z=await JSZip.loadAsync(file),j=JSON.parse(await z.file('data.json').async('string'));if(j.app!=='CPS'||!Object.keys(S).every(c=>Array.isArray(j.data[c])))throw Error('Tệp không đúng định dạng sao lưu.');
 if(!confirm('Phục hồi sẽ GHI ĐÈ dữ liệu hiện tại và thêm/ghi đè tệp đính kèm. Tiếp tục?'))return;D=Object.assign(init(),j.data);const ix=JSON.parse(await z.file('files.json').async('string'));for(const m of ix){const b=await z.file('files/'+m.id).async('blob');await fx('readwrite',s=>s.put({...m,blob:b}))}save();render();toast('Đã phục hồi dữ liệu và '+ix.length+' tệp.')}catch(e){toast('Phục hồi thất bại: '+e.message)}}
function xlsxOut(){if(!window.XLSX){toast('Không tải được thư viện Excel.');return}const wb=XLSX.utils.book_new();Object.keys(S).forEach(c=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(live(c).map(x=>Object.fromEntries(S[c].f.map(f=>[f[1].replace(/ \(.*/,''),Array.isArray(x[f[0]])?x[f[0]].map(refName).join(', '):x[f[0]]??''])))),S[c].t.slice(0,30).replace(/[\/\\?*\[\]:]/g,' ')));dl(new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})]),'Danh_muc_ho_so_'+today()+'.xlsx')}
/* Khóa ứng dụng, tự xóa thùng rác */
const hash=async s=>{try{return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return'w'+h}};
function lock(){if(!D.cfg.pwh)return;const o=document.createElement('div');o.id='lk';o.style.cssText='position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center';o.innerHTML='<div class="card"><b>Ứng dụng đang khóa</b><label>Mật khẩu<input type="password" id="lpw"></label><button class="btn p" id="lgo">Mở khóa</button></div>';document.body.appendChild(o)}
(function(){const r=+D.cfg.ret;if(r>0){const lim=Date.now()-r*864e5;let ch=0;Object.keys(S).forEach(c=>{const b=D[c].length;D[c]=D[c].filter(x=>!(typeof x.del==='string'&&new Date(x.del)<lim));ch+=b-D[c].length});if(ch)save()}})();
document.addEventListener('click',e=>{const t=e.target.closest('[id],[data-sort],[data-pg],[data-chk],[data-gen],[data-vopen],[data-vdup],[data-vdel],[data-iedit],[data-idel],[data-igen]');if(!t)return;const id=t.id,a=t.dataset;
 if(a.sort){SORT=SORT&&SORT.k===a.sort?{k:a.sort,d:-SORT.d}:{k:a.sort,d:1};render()}
 else if(a.pg){PG+=+a.pg;rows()}
 else if(a.chk){t.checked?CHK.add(a.chk):CHK.delete(a.chk);rows()}
 else if(id==='bdel'){if(confirm('Chuyển '+CHK.size+' bản ghi vào thùng rác?')){D[cur].forEach(x=>{if(CHK.has(x.id))x.del=new Date().toISOString()});logA('Xóa hàng loạt '+CHK.size+' bản ghi: '+S[cur].t);CHK.clear();save();render()}}
 else if(id==='btag'){const g=prompt('Nhập nhãn cần gắn:');if(g&&g.trim()){D[cur].forEach(x=>{if(CHK.has(x.id))x.tags=[x.tags,g.trim()].filter(Boolean).join(', ')});save();CHK.clear();render()}}
 else if(id==='fsave'){if(Q.trim()){D.cfg.filters=[...new Set([...(D.cfg.filters||[]),Q.trim()])];save();render();toast('Đã lưu bộ lọc.')}else toast('Hãy nhập từ khóa lọc trước.')}
 else if(a.gen){const p=D.projects.find(x=>x.id===a.gen),g=genProj(p),d=$('#dlg');d.innerHTML=`<form method="dialog"><h3>Mô tả dự án: ${esc(p.name)}</h3><p class="sub">Sinh theo quy tắc, chỉ từ dữ liệu bạn đã nhập. Hãy đọc lại trước khi dùng.</p><label>Mô tả ngắn (CV)<textarea readonly>${esc(g.sh)}</textarea></label><label>Mô tả chi tiết (hồ sơ năng lực)<textarea readonly style="min-height:130px">${esc(g.det)}</textarea></label><label>Danh sách trách nhiệm<textarea readonly>${esc(g.du.map(x=>'• '+x).join('\n'))}</textarea></label><label>Danh sách kết quả<textarea readonly>${esc(g.re.map(x=>'• '+x).join('\n'))}</textarea></label><div class="bar"><button class="btn p">Đóng</button></div></form>`;d.showModal()}
 else if(id==='iadd')introForm();else if(a.iedit)introForm(a.iedit);
 else if(a.idel){if(confirm('Xóa bản giới thiệu này?')){D.intros=D.intros.filter(i=>i.id!==a.idel);if(D.cfg.introId===a.idel)D.cfg.introId='';save();render()}}
 else if(a.igen){const P=D.profile.intro;if(!P){toast('Hãy nhập phần Giới thiệu bản thân trước.');return}const n=+a.igen,s=P.split(/(?<=[.!?])\s+/).filter(Boolean);(D.intros=D.intros||[]).push({id:uid(),name:n===1?'Ngắn':n===3?'Vừa':'Dài',text:s.slice(0,n).join(' ')});save();render()}
 else if(id==='vsave'){const n=$('#vname').value.trim();if(!n){toast('Hãy đặt tên phiên bản.');return}(D.versions=D.versions||[]).push({id:uid(),name:n,type:cur,tpl:D.cfg.tpl,purpose:D.cfg.purpose,introId:D.cfg.introId||'',sel:{...D.cvsel},date:new Date().toISOString()});logA('Lưu phiên bản '+n);save();render();toast('Đã lưu phiên bản.')}
 else if(a.vopen){const v=D.versions.find(x=>x.id===a.vopen);D.cvsel={...v.sel};D.cfg.tpl=v.tpl;D.cfg.purpose=v.purpose;D.cfg.introId=v.introId;save();render();toast('Đã mở phiên bản “'+v.name+'”.')}
 else if(a.vdup){const v=D.versions.find(x=>x.id===a.vdup);D.versions.push({...v,id:uid(),name:v.name+' (bản sao)',sel:{...v.sel},date:new Date().toISOString()});save();render()}
 else if(a.vdel){if(confirm('Xóa phiên bản này?')){D.versions=D.versions.filter(x=>x.id!==a.vdel);save();render()}}
 else if(id==='vcmp'){const ck=[...document.querySelectorAll('[data-vcmp]:checked')].map(i=>D.versions.find(v=>v.id===i.dataset.vcmp));if(ck.length!==2){toast('Hãy tích đúng 2 phiên bản.');return}const[A,B]=ck,ka=Object.keys(A.sel),kb=Object.keys(B.sel),L=(l)=>l.length?l.map(refName).map(esc).join('; '):'(không)';
  $('#vres').innerHTML=`<p><b>Chỉ có ở “${esc(A.name)}”:</b> ${L(ka.filter(k=>!B.sel[k]))}</p><p><b>Chỉ có ở “${esc(B.name)}”:</b> ${L(kb.filter(k=>!A.sel[k]))}</p><p><b>Chung:</b> ${ka.filter(k=>B.sel[k]).length} mục. Mẫu: ${esc(A.tpl)} / ${esc(B.tpl)}.</p>`}
 else if(id==='bexp'){exportDocx('cv');setTimeout(()=>exportDocx('portfolio'),600)}
 else if(id==='bkz')zipBackup();else if(id==='xl')xlsxOut();
 else if(id==='spwset'){const v=$('#spw').value;if(v.length<4){toast('Mật khẩu tối thiểu 4 ký tự.');return}hash(v).then(h=>{D.cfg.pwh=h;save();render();toast('Đã đặt mật khẩu.')})}
 else if(id==='spwdel'){delete D.cfg.pwh;save();render()}
 else if(id==='lgo')hash($('#lpw').value).then(h=>{if(h===D.cfg.pwh)$('#lk').remove();else toast('Sai mật khẩu.')})});
document.addEventListener('change',e=>{const t=e.target,id=t.id;
 if(id==='fsel'&&t.value!==''){Q=D.cfg.filters[+t.value];$('#q').value=Q;rows()}
 else if(id==='isel'){D.cfg.introId=t.value;save();$('#pv').innerHTML=pvHTML(cur)}
 else if(id==='rsz'&&t.files[0]){zipRestore(t.files[0]);t.value=''}
 else if(id==='scol'){D.cfg.color=t.value;save()}else if(id==='sfont'){D.cfg.font=t.value;save()}
 else if(id==='shdr'){D.cfg.hdr=t.value;save()}else if(id==='sfoot'){D.cfg.foot=t.value;save()}else if(id==='sret'){D.cfg.ret=t.value;save()}});
lock();
render();
</script></body></html>
