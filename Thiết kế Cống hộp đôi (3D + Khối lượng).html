<style>

#app{height:100vh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}header{display:flex;align-items:center;gap:12px;padding:9px 12px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 2px 8px #0002;z-index:5}header b{font-size:17px}header span{font-size:13px;opacity:.86}.spacer{flex:1}

#workspace{position:relative;min-height:0}#viewer{position:absolute;inset:0;background:linear-gradient(#eaf1f6,#f8fafc)}canvas{display:block}.toolbar{position:absolute;z-index:4;left:12px;top:12px;right:12px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}.toolbar button{pointer-events:auto;box-shadow:0 2px 7px #0001;background:#fffffff0}.toolbar button.active,.toolbar button.primary{background:var(--navy);color:#fff}

<body>
<div id="app">
<header><b>NTCONS • CỐNG HỘP 2 KHOANG • R4</b><span>3D tham số • BTCT 2 lớp thép • DXF 3D • khối lượng</span><div class="spacer"></div><button id="fullscreen">⛶</button></header>
<div id="workspace"><div id="viewer"></div>
<nav class="toolbar">
<button class="primary" data-view="ISO">3D</button><button data-view="MB">MB</button><button data-view="CD">CD</button><button data-view="CN">CN</button><button id="fit">Vừa khung</button><button data-panel="geometry">Kích thước</button><button data-panel="components">Cấu kiện</button><button data-panel="rebar">Thép</button><button id="xray">X-ray</button><button data-panel="section">Section</button><button data-panel="quantity">Khối lượng</button><button data-panel="export">Xuất</button>

<script>
(()=>{'use strict';
const STORAGE='NTCONS_BOX2_3D_R2';
const DEF={B:5,H:5,L:4.10,tb:.50,tw:.50,tt:.50,c:.30,cover:.04,frameSpacing:.20,
  rebar:{floor:{on:true,dia:16,spacing:.20},wall:{on:true,dia:16,spacing:.20},roof:{on:true,dia:16,spacing:.20},chamfer:{on:true,dia:16,spacing:.20}},
  show:{floor:true,wall:true,roof:true,chamfer:true,ground:true,rebarFloor:true,rebarWall:true,rebarRoof:true,rebarChamfer:true},
  colors:{floor:'#83abc1',wall:'#6f93ae',roof:'#c3d2df',chamfer:'#d5a45c',ground:'#cfe2d4',rebarFloor:'#d74c42',rebarWall:'#198b69',rebarRoof:'#6d53c6',rebarChamfer:'#d69723'},
  section:{enabled:false,arrows:true,xmin:0,xmax:4.10,ymin:-5.75,ymax:5.75,zmin:0,zmax:6},xray:false};
let cfg=load();
function clone(o){return JSON.parse(JSON.stringify(o))} function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){a[k]=deepMerge(a[k]||{},b[k])}else a[k]=b[k]}return a}
function load(){try{return deepMerge(clone(DEF),JSON.parse(localStorage.getItem(STORAGE)||'{}'))}catch(e){return clone(DEF)}}
let saveTimer;function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>localStorage.setItem(STORAGE,JSON.stringify(cfg)),120)}
const viewer=document.getElementById('viewer');const scene=new THREE.Scene();scene.background=new THREE.Color(0xf3f7fa);
const camera=new THREE.PerspectiveCamera(38,1,.01,300);camera.up.set(0,0,1);camera.position.set(12,-16,10);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.localClippingEnabled=true;viewer.appendChild(renderer.domElement);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.08;controls.screenSpacePanning=true;controls.mouseButtons.LEFT=THREE.MOUSE.ROTATE;controls.mouseButtons.RIGHT=THREE.MOUSE.PAN;controls.target.set(cfg.L/2,0,3);
scene.add(new THREE.HemisphereLight(0xffffff,0x78909c,1.15));const sun=new THREE.DirectionalLight(0xffffff,.75);sun.position.set(-8,-10,16);scene.add(sun);
const model=new THREE.Group();scene.add(model);const arrowGroup=new THREE.Group();scene.add(arrowGroup);let meshes=[],bars=[],faces=[];let mats={};let bounds={};
const clip=[new THREE.Plane(),new THREE.Plane(),new THREE.Plane(),new THREE.Plane(),new THREE.Plane(),new THREE.Plane()];
function dim(){const W=2*cfg.B+3*cfg.tw, Z=cfg.tb+cfg.H+cfg.tt;return{W,Z,y0:-W/2,y1:W/2,zF:cfg.tb,zR:cfg.tb+cfg.H,cell1:[-W/2+cfg.tw,-W/2+cfg.tw+cfg.B],cell2:[-W/2+2*cfg.tw+cfg.B,-W/2+2*cfg.tw+2*cfg.B]}}
function material(key){const m=new THREE.MeshStandardMaterial({color:cfg.colors[key],roughness:.78,metalness:0,transparent:true,opacity:cfg.xray ? .24 : .86,side:THREE.DoubleSide,clippingPlanes:clip,clipIntersection:false});m.userData.key=key;return m}
function edge(mesh){const e=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry,20),new THREE.LineBasicMaterial({color:0x29475d,transparent:true,opacity:.62,clippingPlanes:clip}));mesh.add(e)}
function box(key,name,x0,x1,y0,y1,z0,z1){const g=new THREE.BoxGeometry(x1-x0,y1-y0,z1-z0);const m=new THREE.Mesh(g,mats[key]);m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);m.name=name;m.userData={type:'concrete',key};edge(m);model.add(m);meshes.push(m);faces.push({kind:'box',key,name,x0,x1,y0,y1,z0,z1});return m}
function triPrism(key,name,x0,x1,pts){const shape=new THREE.Shape();shape.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)shape.lineTo(pts[i][0],pts[i][1]);shape.closePath();const g=new THREE.ExtrudeGeometry(shape,{depth:x1-x0,bevelEnabled:false,steps:1});g.rotateY(Math.PI/2);g.translate(x0,0,0); // shape x->Y and shape y->Z after mapping below fixed by rotation/translation
  // Extrude shape originally XY, depth Z. Rotate around Y maps depth to X but shape X remains mixed; rebuild coordinates explicitly for reliability.
  g.dispose();
  const v=[];for(const x of [x0,x1])for(const p of pts)v.push(x,p[0],p[1]);const idx=[0,2,1, 3,4,5, 0,1,4,0,4,3, 1,2,5,1,5,4, 2,0,3,2,3,5];
  const gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.Float32BufferAttribute(v,3));gg.setIndex(idx);gg.computeVertexNormals();const m=new THREE.Mesh(gg,mats[key]);m.name=name;m.userData={type:'concrete',key};edge(m);model.add(m);meshes.push(m);faces.push({kind:'tri',key,name,x0,x1,pts});return m}
function clearGroup(){while(model.children.length){const o=model.children.pop();o.traverse(n=>{if(n.geometry)n.geometry.dispose();if(n.material&&!Object.values(mats).includes(n.material)&&n.material.dispose)n.material.dispose()})}meshes=[];bars=[];faces=[]}
function addBarSeg(key,dia,a,b,tag=''){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=new THREE.Vector3().subVectors(B,A),len=d.length();if(len<1e-7)return;const geo=new THREE.CylinderGeometry(dia/2000,dia/2000,len,8);const mat=new THREE.MeshStandardMaterial({color:cfg.colors[key],roughness:.42,metalness:.25,clippingPlanes:clip});const m=new THREE.Mesh(geo,mat);m.position.copy(A).add(B).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());m.renderOrder=20;m.userData={type:'rebar',key,tag};model.add(m);bars.push({key,dia,a:[...a],b:[...b],len,tag,mesh:m})}
function seg(key,dia,p1,p2,x){addBarSeg(key,dia,[x,p1[0],p1[1]],[x,p2[0],p2[1]],'frame')}
function rangeVals(a,b,s){if(b<a)return[];const n=Math.max(1,Math.floor((b-a)/s));const arr=[];for(let i=0;i<=n;i++)arr.push(a+(b-a)*i/n);return arr}
function innerRing(cell,d){const [yl,yr]=cell,c=Math.min(cfg.c,(yr-yl)/3,cfg.H/3),cv=Math.min(cfg.cover,.45*Math.min(cfg.tb,cfg.tw,cfg.tt));const z0=d.zF,z1=d.zR;
 return [[yl+c,z0-cv],[yr-c,z0-cv],[yr+cv,z0+c],[yr+cv,z1-c],[yr-c,z1+cv],[yl+c,z1+cv],[yl-cv,z1-c],[yl-cv,z0+c],[yl+c,z0-cv]]}
function outerRing(d){const cv=Math.min(cfg.cover,.45*Math.min(cfg.tb,cfg.tw,cfg.tt));return [[d.y0+cv,cv],[d.y1-cv,cv],[d.y1-cv,d.Z-cv],[d.y0+cv,d.Z-cv],[d.y0+cv,cv]]}
function frameCategory(p1,p2,d){const z=(p1[1]+p2[1])/2;const dy=Math.abs(p2[0]-p1[0]),dz=Math.abs(p2[1]-p1[1]);if(dy>.001&&dz>.001)return'chamfer';if(dy>dz){return z<d.Z/2?'floor':'roof'}return'wall'}
function extendDiag(p1,p2,ext1,ext2){const vx=p2[0]-p1[0],vz=p2[1]-p1[1],L=Math.hypot(vx,vz)||1,uy=vx/L,uz=vz/L;return [[p1[0]-uy*ext1,p1[1]-uz*ext1],[p2[0]+uy*ext2,p2[1]+uz*ext2]]}
function buildFrames(d){
 const spacing=Math.max(.05,cfg.frameSpacing),cv=Math.min(cfg.cover,.45*Math.min(cfg.tb,cfg.tw,cfg.tt));
 const xs=rangeVals(Math.min(cfg.cover,cfg.L/3),Math.max(cfg.cover,cfg.L-Math.min(cfg.cover,cfg.L/3)),spacing);
 // Lớp ngoài: khung kín liên tục quanh toàn bộ tiết diện.
 const ring=outerRing(d);
 for(const x of xs){
   for(let i=0;i<ring.length-1;i++){const cat=frameCategory(ring[i],ring[i+1],d),R=cfg.rebar[cat];if(R?.on)seg('rebar'+cap(cat),R.dia,ring[i],ring[i+1],x)}
   // Lớp trong: các thanh chính được neo xuyên qua cấu kiện giao nhau, không dừng tại mép vát.
   for(const cell of [d.cell1,d.cell2]){
     const [yl,yr]=cell,c=Math.min(cfg.c,(yr-yl)/3,cfg.H/3);
     const yLfar=yl-(cfg.tw-cv), yRfar=yr+(cfg.tw-cv);
     // Thép đáy/nắp lớp trong chạy xuyên hết bề dày hai tường kề, gần chạm lớp thép phía đối diện.
     if(cfg.rebar.floor.on)seg('rebarFloor',cfg.rebar.floor.dia,[yLfar,d.zF-cv],[yRfar,d.zF-cv],x);
     if(cfg.rebar.roof.on) seg('rebarRoof', cfg.rebar.roof.dia, [yLfar,d.zR+cv],[yRfar,d.zR+cv],x);
     // Thép tường lớp trong xuyên xuống đáy và xuyên lên nắp như thép tường lớp ngoài.
     if(cfg.rebar.wall.on){
       seg('rebarWall',cfg.rebar.wall.dia,[yl-cv,cv],[yl-cv,d.Z-cv],x);
       seg('rebarWall',cfg.rebar.wall.dia,[yr+cv,cv],[yr+cv,d.Z-cv],x);
     }
     // Thép xiên vát kéo dài hai đầu vào vùng đáy/nắp và tường, gần chạm lớp thép ngoài.
     if(cfg.rebar.chamfer.on){
       const eFloor=Math.max(0,(cfg.tb-2*cv)*Math.SQRT2),eRoof=Math.max(0,(cfg.tt-2*cv)*Math.SQRT2),eWall=Math.max(0,(cfg.tw-2*cv)*Math.SQRT2);
       const diags=[
         {p1:[yl+c,d.zF-cv],p2:[yl-cv,d.zF+c],a:eFloor,b:eWall},
         {p1:[yr-c,d.zF-cv],p2:[yr+cv,d.zF+c],a:eFloor,b:eWall},
         {p1:[yl-cv,d.zR-c],p2:[yl+c,d.zR+cv],a:eWall,b:eRoof},
         {p1:[yr+cv,d.zR-c],p2:[yr-c,d.zR+cv],a:eWall,b:eRoof}
       ];
       for(const q of diags){const [a,b]=extendDiag(q.p1,q.p2,q.a,q.b);seg('rebarChamfer',cfg.rebar.chamfer.dia,a,b,x)}
     }
   }
 }
}
function cap(s){return s[0].toUpperCase()+s.slice(1)}
function addLongitudinal(d){const cv=Math.min(cfg.cover,.45*Math.min(cfg.tb,cfg.tw,cfg.tt)),x0=cv,x1=Math.max(cv,cfg.L-cv);
 const addX=(cat,y,z)=>{const R=cfg.rebar[cat];if(R.on)addBarSeg('rebar'+cap(cat),R.dia,[x0,y,z],[x1,y,z],'longitudinal')};
 // Outside layer: bottom / roof / two outer walls.
 if(cfg.rebar.floor.on)for(const y of rangeVals(d.y0+cv,d.y1-cv,cfg.rebar.floor.spacing))addX('floor',y,cv);
 if(cfg.rebar.roof.on)for(const y of rangeVals(d.y0+cv,d.y1-cv,cfg.rebar.roof.spacing))addX('roof',y,d.Z-cv);
 if(cfg.rebar.wall.on){for(const z of rangeVals(cv,d.Z-cv,cfg.rebar.wall.spacing)){addX('wall',d.y0+cv,z);addX('wall',d.y1-cv,z)}}
 // Inner layer of each cell, including longitudinal bars placed on each chamfer strip.
 for(const cell of [d.cell1,d.cell2]){const [yl,yr]=cell,c=Math.min(cfg.c,cfg.B/3,cfg.H/3);
   if(cfg.rebar.floor.on)for(const y of rangeVals(yl+c,yr-c,cfg.rebar.floor.spacing))addX('floor',y,d.zF-cv);
   if(cfg.rebar.roof.on)for(const y of rangeVals(yl+c,yr-c,cfg.rebar.roof.spacing))addX('roof',y,d.zR+cv);
   if(cfg.rebar.wall.on)for(const z of rangeVals(d.zF+c,d.zR-c,cfg.rebar.wall.spacing)){addX('wall',yl-cv,z);addX('wall',yr+cv,z)}
   if(cfg.rebar.chamfer.on){const qs=[[yl+c,d.zF-cv,yl-cv,d.zF+c],[yr-c,d.zF-cv,yr+cv,d.zF+c],[yl-cv,d.zR-c,yl+c,d.zR+cv],[yr+cv,d.zR-c,yr-c,d.zR+cv]];for(const q of qs){const len=Math.hypot(q[2]-q[0],q[3]-q[1]),n=Math.max(1,Math.round(len/cfg.rebar.chamfer.spacing));for(let i=0;i<=n;i++){const t=i/n;addX('chamfer',q[0]+(q[2]-q[0])*t,q[1]+(q[3]-q[1])*t)}}}
 }
}
function buildConcrete(d){box('floor','Bản đáy',0,cfg.L,d.y0,d.y1,0,cfg.tb);box('roof','Bản nắp',0,cfg.L,d.y0,d.y1,d.zR,d.Z);box('wall','Tường biên trái',0,cfg.L,d.y0,d.y0+cfg.tw,d.zF,d.zR);box('wall','Tường giữa',0,cfg.L,-cfg.tw/2,cfg.tw/2,d.zF,d.zR);box('wall','Tường biên phải',0,cfg.L,d.y1-cfg.tw,d.y1,d.zF,d.zR);
 const c=Math.min(cfg.c,cfg.B/3,cfg.H/3);for(const [ci,cell] of [d.cell1,d.cell2].entries()){const [yl,yr]=cell;const wedges=[[[yl,d.zF],[yl+c,d.zF],[yl,d.zF+c]],[[yr,d.zF],[yr-c,d.zF],[yr,d.zF+c]],[[yl,d.zR],[yl+c,d.zR],[yl,d.zR-c]],[[yr,d.zR],[yr-c,d.zR],[yr,d.zR-c]]];wedges.forEach((p,i)=>triPrism('chamfer',`Vát K${ci+1}-${i+1}`,0,cfg.L,p))}}
function buildGround(d){const size=Math.max(28,d.W*2.3);const g=new THREE.PlaneGeometry(size,size,24,24),m=new THREE.MeshBasicMaterial({color:cfg.colors.ground,wireframe:true,transparent:true,opacity:.35});const p=new THREE.Mesh(g,m);p.position.set(cfg.L/2,0,-.012);p.name='Mặt đất lưới';p.userData={type:'ground',key:'ground'};model.add(p);meshes.push(p)}
function rebuild(keepCamera=true){const oldPos=camera.position.clone(),oldTarget=controls.target.clone();clearGroup();const d=dim();bounds={xmin:0,xmax:cfg.L,ymin:d.y0,ymax:d.y1,zmin:0,zmax:d.Z};
 mats={floor:material('floor'),wall:material('wall'),roof:material('roof'),chamfer:material('chamfer')};buildConcrete(d);buildGround(d);buildFrames(d);addLongitudinal(d);applyVisibility();syncSectionToBounds();updateClip();buildArrows();if(keepCamera){camera.position.copy(oldPos);controls.target.copy(oldTarget)}else fit();save();updateStatus()}
function applyVisibility(){for(const m of meshes){const k=m.userData.key;if(k&&k in cfg.show)m.visible=!!cfg.show[k];else if(k==='ground')m.visible=!!cfg.show.ground}for(const b of bars){const key=b.key.replace(/^rebar/,'');const showKey='rebar'+key;b.mesh.visible=cfg.show[showKey]!==false}for(const m of Object.values(mats)){m.opacity=cfg.xray ? .22 : .86;m.transparent=true;m.depthWrite=!cfg.xray}document.getElementById('xray').classList.toggle('active',cfg.xray);document.getElementById('xray').textContent='X-ray'+(cfg.xray?' ✓':'')}
function syncSectionToBounds(){const s=cfg.section;if(!s.enabled||!Number.isFinite(s.xmin)){Object.assign(s,bounds);return}s.xmin=Math.max(bounds.xmin,Math.min(s.xmin,bounds.xmax));s.xmax=Math.max(s.xmin,Math.min(s.xmax,bounds.xmax));s.ymin=Math.max(bounds.ymin,Math.min(s.ymin,bounds.ymax));s.ymax=Math.max(s.ymin,Math.min(s.ymax,bounds.ymax));s.zmin=Math.max(bounds.zmin,Math.min(s.zmin,bounds.zmax));s.zmax=Math.max(s.zmin,Math.min(s.zmax,bounds.zmax))}
function updateClip(){const s=cfg.section,en=s.enabled;clip[0].set(new THREE.Vector3(1,0,0),-s.xmin);clip[1].set(new THREE.Vector3(-1,0,0),s.xmax);clip[2].set(new THREE.Vector3(0,1,0),-s.ymin);clip[3].set(new THREE.Vector3(0,-1,0),s.ymax);clip[4].set(new THREE.Vector3(0,0,1),-s.zmin);clip[5].set(new THREE.Vector3(0,0,-1),s.zmax);for(const p of clip)p.constant=en?p.constant:1e6;arrowGroup.visible=en&&s.arrows;save()}
function arrow(face,origin,dir,color){const a=new THREE.ArrowHelper(new THREE.Vector3(...dir),new THREE.Vector3(...origin),1.0,color,.28,.15);a.userData.face=face;a.traverse(o=>o.userData.face=face);arrowGroup.add(a);return a}
function buildArrows(){while(arrowGroup.children.length)arrowGroup.remove(arrowGroup.children[0]);const s=cfg.section,cx=(s.xmin+s.xmax)/2,cy=(s.ymin+s.ymax)/2,cz=(s.zmin+s.zmax)/2;arrow('xmin',[s.xmin,cy,cz],[-1,0,0],0xd14b45);arrow('xmax',[s.xmax,cy,cz],[1,0,0],0xd14b45);arrow('ymin',[cx,s.ymin,cz],[0,-1,0],0x2d7bb5);arrow('ymax',[cx,s.ymax,cz],[0,1,0],0x2d7bb5);arrow('zmin',[cx,cy,s.zmin],[0,0,-1],0x2f9b68);arrow('zmax',[cx,cy,s.zmax],[0,0,1],0x2f9b68);arrowGroup.visible=s.enabled&&s.arrows}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let drag=null;function pointerNDC(e){const r=renderer.domElement.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-(e.clientY-r.top)/r.height*2+1}
renderer.domElement.addEventListener('pointerdown',e=>{if(!cfg.section.enabled||!cfg.section.arrows)return;pointerNDC(e);ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(arrowGroup.children,true)[0];if(!hit)return;let face=hit.object.userData.face;if(!face)return;const axis=face[0]==='x'?new THREE.Vector3(1,0,0):face[0]==='y'?new THREE.Vector3(0,1,0):new THREE.Vector3(0,0,1);const origin=hit.point.clone(),normal=camera.getWorldDirection(new THREE.Vector3());const plane=new THREE.Plane().setFromNormalAndCoplanarPoint(normal,origin);const start=new THREE.Vector3();ray.ray.intersectPlane(plane,start);drag={face,axis,start,value:cfg.section[face],plane};controls.enabled=false;e.preventDefault()});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;pointerNDC(e);ray.setFromCamera(mouse,camera);const p=new THREE.Vector3();if(!ray.ray.intersectPlane(drag.plane,p))return;const delta=p.clone().sub(drag.start).dot(drag.axis);let v=drag.value+delta;const f=drag.face;if(f==='xmin')v=Math.min(cfg.section.xmax-.02,Math.max(bounds.xmin,v));if(f==='xmax')v=Math.max(cfg.section.xmin+.02,Math.min(bounds.xmax,v));if(f==='ymin')v=Math.min(cfg.section.ymax-.02,Math.max(bounds.ymin,v));if(f==='ymax')v=Math.max(cfg.section.ymin+.02,Math.min(bounds.ymax,v));if(f==='zmin')v=Math.min(cfg.section.zmax-.02,Math.max(bounds.zmin,v));if(f==='zmax')v=Math.max(cfg.section.zmin+.02,Math.min(bounds.zmax,v));cfg.section[f]=v;updateClip();buildArrows();if(document.getElementById('panel').dataset.kind==='section')renderPanel('section')});
window.addEventListener('pointerup',()=>{if(drag){drag=null;controls.enabled=true;save()}});
function fit(){const d=dim(),center=new THREE.Vector3(cfg.L/2,0,d.Z/2),span=Math.max(cfg.L,d.W,d.Z);controls.target.copy(center);const dir=new THREE.Vector3(1.1,-1.5,.9).normalize();camera.position.copy(center).add(dir.multiplyScalar(span*1.9));camera.near=.01;camera.far=span*50;camera.updateProjectionMatrix();controls.update()}
function setView(v){const d=dim(),c=new THREE.Vector3(cfg.L/2,0,d.Z/2),span=Math.max(cfg.L,d.W,d.Z);controls.target.copy(c);if(v==='MB')camera.position.set(c.x,c.y,c.z+span*2.0);else if(v==='CD')camera.position.set(c.x-span*2.0,c.y,c.z+.25);else if(v==='CN')camera.position.set(c.x,c.y-span*2.0,c.z+.25);else camera.position.copy(c).add(new THREE.Vector3(1.1,-1.5,.9).normalize().multiplyScalar(span*1.9));camera.lookAt(c);controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v))}
function resize(){const r=viewer.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);
function quantity(){const d=dim(),c=Math.min(cfg.c,cfg.B/3,cfg.H/3);const q=[];q.push(['Bê tông đáy',cfg.L*d.W*cfg.tb,'m³']);q.push(['Bê tông nắp',cfg.L*d.W*cfg.tt,'m³']);q.push(['Bê tông tường',cfg.L*cfg.H*cfg.tw*3,'m³']);q.push(['Bê tông vát',8*.5*c*c*cfg.L,'m³']);q.push(['Tổng bê tông',q.slice(0,4).reduce((s,x)=>s+x[1],0),'m³']);q.push(['Ván khuôn đáy',2*(cfg.L+d.W)*cfg.tb,'m²']);q.push(['Ván khuôn tường',6*cfg.L*cfg.H,'m²']);q.push(['Ván khuôn nắp',2*cfg.B*cfg.L+2*(cfg.L+d.W)*cfg.tt,'m²']);q.push(['Ván khuôn vát',8*Math.SQRT2*c*cfg.L,'m²']);const by={floor:0,wall:0,roof:0,chamfer:0};for(const b of bars){const cat=b.key.replace('rebar','').toLowerCase();if(by[cat]!=null)by[cat]+=b.len*(b.dia*b.dia/162)}q.push(['Thép đáy',by.floor,'kg']);q.push(['Thép tường',by.wall,'kg']);q.push(['Thép nắp',by.roof,'kg']);q.push(['Thép vát',by.chamfer,'kg']);q.push(['Tổng thép',Object.values(by).reduce((a,b)=>a+b,0),'kg']);return q}
function f3(v){return Number(v).toFixed(3)}
function colorRow(k,label){return `<div class="row"><span>${label}</span><input type="color" data-color="${k}" value="${cfg.colors[k]}"></div>`}
function checkRow(path,label){const parts=path.split('.');let v=cfg;for(const p of parts)v=v[p];return `<label class="check"><input type="checkbox" data-check="${path}" ${v?'checked':''}>${label}</label>`}
function geometryPanel(){return `<h2>Kích thước cấu kiện</h2><p class="hint">Mặc định theo cấu kiện đang dựng: 2 khoang thông thủy 5×5 m, dày đáy/tường/nắp 0,50 m, dài 4,10 m, vát 0,30 m.</p><div class="grid2">${num('B','Khẩu độ mỗi khoang B (m)',.1)}${num('H','Chiều cao thông thủy H (m)',.1)}${num('L','Chiều dài thân L (m)',.1)}${num('c','Vát góc c (m)',.05)}${num('tb','Dày đáy (m)',.05)}${num('tw','Dày tường (m)',.05)}${num('tt','Dày nắp (m)',.05)}</div><div class="btnrow"><button id="saveNow">Lưu</button><button id="resetAll">Khôi phục gốc</button></div>`}
function num(k,label,step){return `<label>${label}<input type="number" data-num="${k}" min="0.01" step="${step}" value="${cfg[k]}"></label>`}
function componentsPanel(){return `<h2>Cấu kiện & màu sắc</h2>${checkRow('show.floor','Hiện bản đáy')}${colorRow('floor','Màu bê tông đáy')}${checkRow('show.wall','Hiện tường')}${colorRow('wall','Màu bê tông tường')}${checkRow('show.roof','Hiện bản nắp')}${colorRow('roof','Màu bê tông nắp')}${checkRow('show.chamfer','Hiện các vát góc')}${colorRow('chamfer','Màu bê tông vát')}${checkRow('show.ground','Hiện mặt đất lưới')}${colorRow('ground','Màu mặt đất')}`}
function rebarPanel(){const card=(k,title)=>`<h3>${title} — luôn 2 lớp</h3>${checkRow('rebar.'+k+'.on','Bố trí thép '+title.toLowerCase())}<div class="grid2"><label>Đường kính Ø (mm)<input data-rnum="${k}.dia" type="number" min="6" step="1" value="${cfg.rebar[k].dia}"></label><label>Khoảng cách a (m)<input data-rnum="${k}.spacing" type="number" min=".05" step=".01" value="${cfg.rebar[k].spacing}"></label></div>${colorRow('rebar'+cap(k),'Màu thép '+title.toLowerCase())}`;return `<h2>Cốt thép BTCT</h2><p class="hint">Mọi cấu kiện BTCT dùng 2 lớp thép. Lớp trong được neo xuyên qua vùng giao: thép tường xuyên đáy–nắp, thép đáy/nắp vượt qua bề dày tường; thép vát xiên kéo dài hai đầu gần tới lớp ngoài. Thanh dọc chạy hết chiều dài hữu hiệu.</p><div class="grid2"><label>Lớp bảo vệ (m)<input data-num="cover" type="number" min=".015" step=".005" value="${cfg.cover}"></label><label>Bước khung mặt cắt (m)<input data-num="frameSpacing" type="number" min=".05" step=".01" value="${cfg.frameSpacing}"></label></div>${card('floor','Đáy')}${card('wall','Tường')}${card('roof','Nắp')}${card('chamfer','Vát xiên')}<hr class="sep">${checkRow('show.rebarFloor','Hiện thép đáy')}${checkRow('show.rebarWall','Hiện thép tường')}${checkRow('show.rebarRoof','Hiện thép nắp')}${checkRow('show.rebarChamfer','Hiện thép vát')}`}
function sectionPanel(){const s=cfg.section;return `<h2>Section Box</h2>${checkRow('section.enabled','Bật cắt 3D')}${checkRow('section.arrows','Hiện 6 mũi tên kéo trực tiếp')}<p class="hint">Bật Section để hiện nguyên bộ 6 mũi tên. Kéo trực tiếp mũi tên trên mô hình; có thể ẩn mũi tên mà vẫn giữ nguyên mặt cắt.</p><div class="grid2"><label>X min<input data-sec="xmin" type="number" step=".05" value="${f3(s.xmin)}"></label><label>X max<input data-sec="xmax" type="number" step=".05" value="${f3(s.xmax)}"></label><label>Y min<input data-sec="ymin" type="number" step=".05" value="${f3(s.ymin)}"></label><label>Y max<input data-sec="ymax" type="number" step=".05" value="${f3(s.ymax)}"></label><label>Z min<input data-sec="zmin" type="number" step=".05" value="${f3(s.zmin)}"></label><label>Z max<input data-sec="zmax" type="number" step=".05" value="${f3(s.zmax)}"></label></div><div class="btnrow"><button id="resetSection">Mở toàn bộ</button><button id="toggleArrows">${s.arrows?'Ẩn':'Hiện'} mũi tên</button></div>`}
function quantityPanel(){const q=quantity();let rows=q.map(x=>`<tr><td>${x[0]}</td><td>${x[2]==='kg'?x[1].toFixed(1):x[1].toFixed(3)}</td><td>${x[2]}</td></tr>`).join('');const d=dim();return `<h2>Khối lượng mô hình</h2><div class="metricgrid"><div class="metric"><b>${f3(d.W)} m</b><span>Bề rộng ngoài</span></div><div class="metric"><b>${f3(d.Z)} m</b><span>Chiều cao ngoài</span></div></div><h3>Bảng tổng hợp</h3><table class="tbl"><thead><tr><th>Hạng mục</th><th>Khối lượng</th><th>ĐV</th></tr></thead><tbody>${rows}</tbody></table><p class="hint">Ván khuôn là khối lượng hình học ước tính theo các mặt tiếp xúc cần tạo khuôn. Khối lượng thép lấy trực tiếp tổng chiều dài thanh đang sinh trong mô hình × d²/162; chưa cộng nối chồng/neo/hao hụt.</p><button class="primary" id="exportQ">Xuất khối lượng CSV</button>`}
function exportPanel(){return `<h2>Xuất dữ liệu</h2><label>Đơn vị DXF<select id="dxfUnit"><option value="1000">mm</option><option value="1">m</option></select></label><div class="btnrow"><button class="primary" id="exportDXF">Xuất DXF 3D</button><button id="exportPNG">Xuất PNG</button></div><div class="btnrow"><button id="exportQ">Xuất khối lượng CSV</button><button id="exportJSON">Xuất cấu hình JSON</button></div><p class="hint">DXF ASCII R12 tương thích AutoCAD: bê tông = 3DFACE; thép = 3D LINE; tự bỏ entity lỗi; tọa độ được xuất theo lựa chọn mm/m.</p>`}
function renderPanel(kind){const p=document.getElementById('panel'),b=document.getElementById('panelBody');p.hidden=false;p.dataset.kind=kind;b.innerHTML=kind==='geometry'?geometryPanel():kind==='components'?componentsPanel():kind==='rebar'?rebarPanel():kind==='section'?sectionPanel():kind==='quantity'?quantityPanel():exportPanel();bindPanel()}
function getPath(path){return path.split('.').reduce((o,k)=>o[k],cfg)}function setPath(path,v){const a=path.split('.'),k=a.pop();let o=cfg;for(const p of a)o=o[p];o[k]=v}
function bindPanel(){document.querySelectorAll('[data-num]').forEach(el=>el.onchange=()=>{cfg[el.dataset.num]=Math.max(.001,+el.value||0);rebuild()});document.querySelectorAll('[data-rnum]').forEach(el=>el.onchange=()=>{const [k,p]=el.dataset.rnum.split('.');cfg.rebar[k][p]=Math.max(p==='dia'?6:.03,+el.value||0);rebuild()});document.querySelectorAll('[data-check]').forEach(el=>el.onchange=()=>{setPath(el.dataset.check,el.checked);if(el.dataset.check.startsWith('section.')){updateClip();buildArrows();renderPanel('section')}else if(el.dataset.check.startsWith('show.')){applyVisibility();save()}else rebuild()});document.querySelectorAll('[data-color]').forEach(el=>el.oninput=()=>{cfg.colors[el.dataset.color]=el.value;rebuild()});document.querySelectorAll('[data-sec]').forEach(el=>el.onchange=()=>{cfg.section[el.dataset.sec]=+el.value;syncSectionToBounds();updateClip();buildArrows();renderPanel('section')});
 const sv=document.getElementById('saveNow');if(sv)sv.onclick=()=>{localStorage.setItem(STORAGE,JSON.stringify(cfg));sv.textContent='Đã lưu ✓';setTimeout(()=>sv.textContent='Lưu',900)};const r=document.getElementById('resetAll');if(r)r.onclick=()=>{cfg=clone(DEF);localStorage.setItem(STORAGE,JSON.stringify(cfg));rebuild(false);renderPanel('geometry')};const rs=document.getElementById('resetSection');if(rs)rs.onclick=()=>{Object.assign(cfg.section,bounds,{enabled:true});updateClip();buildArrows();renderPanel('section')};const ta=document.getElementById('toggleArrows');if(ta)ta.onclick=()=>{cfg.section.arrows=!cfg.section.arrows;updateClip();buildArrows();renderPanel('section')};document.querySelectorAll('#exportQ').forEach(e=>e.onclick=exportQuantity);const dx=document.getElementById('exportDXF');if(dx)dx.onclick=exportDXF;const png=document.getElementById('exportPNG');if(png)png.onclick=exportPNG;const js=document.getElementById('exportJSON');if(js)js.onclick=()=>download('NTCONS_CongHop2_config.json',JSON.stringify(cfg,null,2),'application/json');}
function download(name,text,mime='text/plain'){const blob=new Blob([text],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportQuantity(){const rows=[['Hạng mục','Khối lượng','Đơn vị'],...quantity().map(x=>[x[0],x[1].toFixed(x[2]==='kg'?1:3),x[2]])];download('NTCONS_CongHop2_KhoiLuong.csv','\ufeff'+rows.map(r=>r.join(';')).join('\r\n'),'text/csv;charset=utf-8')}
function dxfNum(v){v=Number(v);if(!Number.isFinite(v))return null;const a=Math.abs(v)<1e-9?0:v;return Number(a.toFixed(6)).toString()}
function dxfPair(code,value){return `${code}\r\n${value}\r\n`}
function dxfTables(){const L=[['0',7],['BT_DAY',151],['BT_TUONG',150],['BT_NAP',8],['BT_VAT',30],['THEP_DAY',1],['THEP_TUONG',3],['THEP_NAP',6],['THEP_VAT',2]];let s='';s+=dxfPair(0,'TABLE')+dxfPair(2,'LTYPE')+dxfPair(70,1);s+=dxfPair(0,'LTYPE')+dxfPair(2,'CONTINUOUS')+dxfPair(70,0)+dxfPair(3,'Solid line')+dxfPair(72,65)+dxfPair(73,0)+dxfPair(40,'0.0');s+=dxfPair(0,'ENDTAB');s+=dxfPair(0,'TABLE')+dxfPair(2,'LAYER')+dxfPair(70,L.length);for(const [n,c] of L)s+=dxfPair(0,'LAYER')+dxfPair(2,n)+dxfPair(70,0)+dxfPair(62,c)+dxfPair(6,'CONTINUOUS');s+=dxfPair(0,'ENDTAB');return s}
function dxfFace(layer,p,u){if(!Array.isArray(p)||p.length<3)return '';const q=p.length===3?[p[0],p[1],p[2],p[2]]:p.slice(0,4),vals=q.flat().map(v=>dxfNum(v*u));if(vals.some(v=>v===null))return '';let s=dxfPair(0,'3DFACE')+dxfPair(8,layer);const codes=[[10,20,30],[11,21,31],[12,22,32],[13,23,33]];for(let i=0;i<4;i++)for(let j=0;j<3;j++)s+=dxfPair(codes[i][j],vals[i*3+j]);return s}
function dxfLine(layer,a,b,u){if(!Array.isArray(a)||!Array.isArray(b)||a.length<3||b.length<3)return '';const v=[a[0],a[1],a[2],b[0],b[1],b[2]].map(x=>dxfNum(x*u));if(v.some(x=>x===null))return '';return dxfPair(0,'LINE')+dxfPair(8,layer)+dxfPair(10,v[0])+dxfPair(20,v[1])+dxfPair(30,v[2])+dxfPair(11,v[3])+dxfPair(21,v[4])+dxfPair(31,v[5])}
function boxDXF(f,u){const v=[[f.x0,f.y0,f.z0],[f.x1,f.y0,f.z0],[f.x1,f.y1,f.z0],[f.x0,f.y1,f.z0],[f.x0,f.y0,f.z1],[f.x1,f.y0,f.z1],[f.x1,f.y1,f.z1],[f.x0,f.y1,f.z1]],F=[[0,1,2,3],[4,7,6,5],[0,4,5,1],[1,5,6,2],[2,6,7,3],[3,7,4,0]],layer=f.key==='floor'?'BT_DAY':f.key==='roof'?'BT_NAP':'BT_TUONG';return F.map(a=>dxfFace(layer,a.map(i=>v[i]),u)).join('')}
function triDXF(f,u){if(!f||!Array.isArray(f.pts)||f.pts.length<3)return '';const a=f.pts.slice(0,3).map(p=>[f.x0,p[0],p[1]]),b=f.pts.slice(0,3).map(p=>[f.x1,p[0],p[1]]);let s=dxfFace('BT_VAT',[a[0],a[1],a[2]],u)+dxfFace('BT_VAT',[b[0],b[2],b[1]],u);for(let i=0;i<3;i++){const j=(i+1)%3;s+=dxfFace('BT_VAT',[a[i],a[j],b[j],b[i]],u)}return s}
function exportDXF(){const sel=document.getElementById('dxfUnit'),u=sel&&Number(sel.value)===1?1:1000;let s='';s+=dxfPair(0,'SECTION')+dxfPair(2,'HEADER')+dxfPair(9,'$ACADVER')+dxfPair(1,'AC1009')+dxfPair(0,'ENDSEC');s+=dxfPair(0,'SECTION')+dxfPair(2,'TABLES')+dxfTables()+dxfPair(0,'ENDSEC');s+=dxfPair(0,'SECTION')+dxfPair(2,'ENTITIES');let entityCount=0;for(const f of faces){const e=f.kind==='box'?boxDXF(f,u):triDXF(f,u);if(e){s+=e;entityCount+=(e.match(/0\r\n(?:3DFACE|LINE)\r\n/g)||[]).length}}for(const b of bars){const lay=b.key==='rebarFloor'?'THEP_DAY':b.key==='rebarWall'?'THEP_TUONG':b.key==='rebarRoof'?'THEP_NAP':'THEP_VAT',e=dxfLine(lay,b.a,b.b,u);if(e){s+=e;entityCount++}}s+=dxfPair(0,'ENDSEC')+dxfPair(0,'EOF');if(!entityCount){alert('Không có đối tượng hợp lệ để xuất DXF.');return}download('NTCONS_CongHop2_3D_R4.dxf',s,'application/dxf')}
function exportPNG(){renderer.render(scene,camera);const a=document.createElement('a');a.href=renderer.domElement.toDataURL('image/png');a.download='NTCONS_CongHop2_3D.png';a.click()}
function updateStatus(){const d=dim(),q=quantity();document.getElementById('selText').textContent=`Ngoài: ${d.W.toFixed(2)} × ${d.Z.toFixed(2)} m · BT ${q[4][1].toFixed(2)} m³ · Thép ${q[q.length-1][1].toFixed(0)} kg`}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>renderPanel(b.dataset.panel));document.getElementById('panelClose').onclick=()=>document.getElementById('panel').hidden=true;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));document.getElementById('fit').onclick=fit;document.getElementById('xray').onclick=()=>{cfg.xray=!cfg.xray;applyVisibility();save()};document.getElementById('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
resize();rebuild(false);setView('ISO');function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();
})();
